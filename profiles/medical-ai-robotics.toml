# Profile: medical-ai-robotics (医学人工智能机器人进展 / medical AI robotics)
# Scope: intelligent robots in CLINICAL medicine — surgical and interventional
# robots, autonomy and AI guidance in the operating room, rehabilitation and
# bionic devices, hospital and laboratory automation, micro/nano-robots for
# diagnosis and drug delivery, and the trials and regulatory approvals that move
# them into practice. Global, including China (NMPA) as well as FDA/CE.
# Home, eldercare and companion robots are covered by `homecare-robotics`.
# Requested by Chiming Wei; bilingual digest: Traditional Chinese on top, English below.

name = "medical-ai-robotics"
description = "Global progress in intelligent medical robots: surgical and interventional robotics, AI autonomy in the OR, rehabilitation and bionics, hospital automation, micro-robots, and the trials and approvals that bring them to patients."

# Grouping in the reader app. "additional" keeps this feed out of the main inbox
# and unread count; the digest is still emailed and still readable under Digests.
reader_group = "additional"

paywalled_domains = [
    "science.org",
    "nature.com",
    "cell.com",
    "thelancet.com",
    "jamanetwork.com",
    "nejm.org",
    "sciencedirect.com",
    "ieee.org",
    "ieeexplore.ieee.org",
    "onlinelibrary.wiley.com",
    "link.springer.com",
    "technologyreview.com",
]

[feeds]
list = [
    # === Medical / surgical robotics journals ===
    "Int J Medical Robotics & Computer Assisted Surgery | https://onlinelibrary.wiley.com/feed/1478596x/most-recent",
    "Journal of Robotic Surgery | https://link.springer.com/search.rss?facet-journal-id=11701",
    "J NeuroEngineering & Rehabilitation | https://link.springer.com/search.rss?facet-journal-id=12984",

    # === Robotics research ===
    "Science Robotics | https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=scirobotics",
    "IEEE Robotics and Automation Letters | https://ieeexplore.ieee.org/rss/TOC7083369.XML",
    "Frontiers in Robotics and AI | https://www.frontiersin.org/journals/robotics-and-ai/rss",
    "arXiv Robotics (cs.RO) | https://rss.arxiv.org/rss/cs.RO",
    "arXiv - surgical robotics | https://export.arxiv.org/api/query?search_query=abs:%22surgical+robot%22+OR+abs:%22robotic+surgery%22&sortBy=submittedDate&sortOrder=descending&max_results=40",
    "arXiv - medical & rehabilitation robots | https://export.arxiv.org/api/query?search_query=abs:%22medical+robot%22+OR+abs:%22rehabilitation+robot%22+OR+abs:%22exoskeleton%22&sortBy=submittedDate&sortOrder=descending&max_results=40",

    # === Biomedical engineering & clinical AI ===
    "Nature Biomedical Engineering | https://www.nature.com/natbiomedeng.rss",
    "Nature Machine Intelligence | https://www.nature.com/natmachintell.rss",
    "npj Digital Medicine | https://www.nature.com/npjdigitalmed.rss",

    # === Industry and trade press (approvals, launches, deployments) ===
    "The Robot Report | https://www.therobotreport.com/feed/",
    "IEEE Spectrum - Robotics | https://spectrum.ieee.org/feeds/topic/robotics.rss",
    "ScienceDaily - Robotics | https://www.sciencedaily.com/rss/computers_math/robotics.xml",
    "Medical Design & Outsourcing | https://www.medicaldesignandoutsourcing.com/feed/",
    "MedCity News | https://medcitynews.com/feed/",
    "MIT Technology Review | https://www.technologyreview.com/feed/",
]

