keywords = [
    "surgical robot",
    "robotic surgery",
    "robot-assisted surgery",
    "autonomous surgery",
    "da Vinci",
    "teleoperated surgery",
    "remote surgery",
    "telesurgery",
    "interventional robot",
    "endovascular robot",
    "endoscopic robot",
    "flexible robot",
    "continuum robot",
    "orthopedic robot",
    "neurosurgical robot",
    "needle steering",
    "image-guided intervention",
    "surgical AI",
    "surgical video analysis",
    "surgical foundation model",
    "embodied AI",
    "rehabilitation robot",
    "exoskeleton",
    "prosthesis",
    "bionic limb",
    "brain-computer interface",
    "microrobot",
    "nanorobot",
    "magnetic microrobot",
    "capsule robot",
    "hospital robot",
    "pharmacy automation",
    "laboratory automation",
    "disinfection robot",
    "medical robot",
    "NMPA approval",
    "FDA clearance",
    "CE mark",
    "clinical trial",
    "randomized controlled trial",
    "patient outcomes",
