narrative = """
This feed tracks GLOBAL PROGRESS IN INTELLIGENT MEDICAL ROBOTS used in clinical care — robots that operate, intervene, rehabilitate, or automate work in hospitals and labs, and the AI that makes them more capable or autonomous. Coverage is worldwide, including China's fast-growing medical robot industry and NMPA approvals as well as FDA and CE milestones.

SURFACE HIGH (score >= 0.70):
- Autonomy and AI in medical robots: autonomous or semi-autonomous surgical tasks, AI guidance and navigation, surgical video understanding, foundation or vision-language-action models trained for surgery, learning from demonstration, and remote or tele-surgery over long distances. This is the heart of the feed.
- New surgical and interventional systems and what they unlock: first-in-human use, regulatory approvals (FDA / NMPA / CE / PMDA), new platforms from any country, and national-scale adoption data. Laparoscopic, orthopedic, neurosurgical, endovascular, endoscopic, dental, and needle-based robots.
- Strong clinical evidence on robotic surgery: randomized trials, large multicentre or national registry studies, and systematic reviews that settle a question.
- Rehabilitation and bionics with clinical evidence: exoskeletons, prosthetic and bionic limbs, robot-assisted therapy after stroke or spinal cord injury, and brain-computer interfaces that drive devices.
- Micro- and nano-robots for targeted drug delivery, diagnosis, or minimally invasive therapy, especially with in-vivo or clinical results.
- Hospital and laboratory automation that changes care: pharmacy, specimen handling, logistics, disinfection, and lab robotics with measured impact.
- Safety, failure, and rigor: adverse events, recalls, learning-curve and cost-effectiveness evidence, and careful negative results.

ALSO TRACK (score 0.5-0.7):
- Routine single-centre or retrospective outcome comparisons (robotic versus laparoscopic or open for one procedure). Useful context, but these are numerous; keep only the larger or more novel ones and do not let them crowd out the items above.
- Strong preclinical or engineering advances with a clear path to patients (new actuation, sensing, haptics, imaging integration).
- Industry news with substance: product launches, national programmes, and partnerships tied to a specific clinical system.
- Policy, training, and ethics of medical robotics.

SCORE DOWN (<= 0.4) OR EXCLUDE:
- Home, eldercare, companion, and social robots, which the separate homecare-robotics digest covers.
- Industrial or warehouse robots with no medical application.
- General AI chatbots or medical language models with no robotic or embodied component.
- Funding announcements and marketing with no clinical or technical substance.
- Purely theoretical control papers with no medical setting.

DEFAULTS:
- Weight AI capability, new systems, approvals and decisive trials above routine outcome reports, and clinical evidence above prototypes.
- Keep the mix broad: surgery, rehabilitation, micro-robots and hospital automation should all appear when there is good work, rather than one journal's output filling the digest.
- When two items describe the same approval or launch, prefer the more detailed and more primary source.
- Explain significance plainly: what the robot does, for which patients, and what is new about it.
"""

[overrides]
min_score = 0.50

