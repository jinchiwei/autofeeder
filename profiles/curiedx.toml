# Profile: curiedx
# Scope: state-of-the-art multimodal / vision-language / foundation-model ML, read
# specifically for transfer into CurieDx's smartphone-photo + symptom diagnostic stack
# (StrepNet / tabcat2). Deliberately NOT a pharyngitis feed: the throat-image
# literature is close to empty, so the useful signal arrives from the methods world
# and from adjacent photographic clinical imaging.

name = "curiedx"
description = "SOTA multimodal / vision-language / foundation-model ML, filtered for what could transfer to smartphone-photo + symptom clinical diagnosis: frozen encoders, label scarcity, site shift, fusion, calibration."

paywalled_domains = [
    "nature.com",
    "science.org",
    "cell.com",
    "thelancet.com",
    "jamanetwork.com",
    "academic.oup.com",
    "onlinelibrary.wiley.com",
    "link.springer.com",
    "ieee.org",
    "ieeexplore.ieee.org",
    "sciencedirect.com",
    "journals.sagepub.com",
    "ai.nejm.org",
    "pubs.rsna.org",
]

