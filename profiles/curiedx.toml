[interests]
keywords = [
    # encoders / pretraining
    "foundation model", "vision-language model", "image encoder", "frozen encoder",
    "linear probe", "linear probing", "partial fine-tuning", "parameter-efficient", "LoRA",
    "self-supervised", "contrastive learning", "CLIP", "SigLIP", "DINOv2", "DINOv3",
    "MedSigLIP", "BiomedCLIP", "open weights", "model license", "commercial use",
    "pretraining data", "scaling law",
    # the transfer question
    "transfer learning", "domain match", "domain-specific pretraining", "natural images",
    "photographic imaging", "smartphone image", "consumer camera", "point-of-care",
    "dermatology", "dermoscopy", "fundus", "endoscopy", "otoscopy", "laryngoscopy",
    "intraoral", "oral cavity", "pharynx", "tonsil", "wound imaging",
    # robustness / deployment
    "domain generalization", "domain adaptation", "domain adversarial", "gradient reversal",
    "distribution shift", "site effect", "center effect", "scanner effect", "batch effect",
    "shortcut learning", "spurious correlation", "confounder", "leave-one-site-out",
    "external validation", "out-of-distribution", "robustness", "Jacobian regularization",
    # multimodal / fusion
    "multimodal", "late fusion", "early fusion", "gating", "modality dropout",
    "missing modality", "modality collapse", "tabular", "structured data", "clinical features",
    "TabPFN", "in-context learning", "audio classification", "cough audio",
    # evaluation / clinical translation
    "calibration", "threshold", "prevalence shift", "decision curve", "net benefit",
    "AUROC", "sensitivity", "specificity", "positive predictive value",
    "TRIPOD", "CLAIM", "reporting guideline", "prospective validation",
    "clinical decision support", "FDA clearance", "regulatory",
    # the clinical problem
    "pharyngitis", "sore throat", "streptococcus", "group A strep", "rapid antigen test",
    "antimicrobial stewardship", "antibiotic prescribing", "respiratory infection",
    "influenza", "triage", "diagnostic accuracy",
    # useful adjacent method families
    "segmentation auxiliary task", "SAM", "MedSAM", "interpretability", "saliency",
    "ensemble", "model soup", "concatenated embeddings",
]

narrative = """
I am Jinchi Wei. I build the diagnostic ML at CurieDx. Our system (StrepNet /
tabcat2) predicts culture-confirmed Group A strep from a SMARTPHONE THROAT PHOTO
plus a symptom questionnaire, with a late-fusion architecture: a tabular
in-context learner on symptoms, a fine-tuned image CNN, and a frozen
vision-language image encoder. We also have a flu arm using CDC surveillance
features, and an audio (cough) branch that has never worked.

READ THIS FEED FOR TRANSFER, NOT FOR TOPIC MATCH. Almost nothing is published on
throat or pharynx imaging - I verified that the field is empty: no throat, otoscopy
or laryngoscopy foundation model exists, and the largest public throat dataset is
742 images. So do NOT wait for strep papers. Score a paper on whether its METHOD
could change what we build, even if the organ, modality or disease is unrelated.

The questions I am actively trying to answer, in priority order:

1. WHICH FROZEN IMAGE ENCODER should carry our image branch. I am running a
   bake-off of general vs medical encoders (DINOv2/v3, SigLIP/SigLIP2, MedSigLIP,
   BiomedCLIP, derm and pathology encoders). Anything that benchmarks encoders
   against each other on PHOTOGRAPHIC clinical images, reports frozen-vs-fine-tuned,
   varies label fraction, or holds the probe head fixed across encoder arms, is
   high value. Resolution as its own axis matters to me: our findings (exudate) are
   small and low contrast.

2. THE DISTANCE-FROM-NATURAL-IMAGES THESIS. My working claim is that
   domain-specific pretraining helps in proportion to how far the modality sits
   from natural photographs - it wins on histopathology and MRI, and general
   encoders like DINOv2 start winning on fundus, dermoscopy, endoscopy. Smartphone
   throat photos are the nearest-to-natural case there is. Any paper that tests
   domain-matched vs general pretraining on photographic medical imaging either
   supports or breaks this, and I want both.

3. SITE SHIFT AND SHORTCUT LEARNING. Our image branch scores BELOW CHANCE at some
   held-out clinics, which means it learned a site-correlated feature that inverts.
   I want: domain generalization evaluated leave-one-site-out (NOT unsupervised
   domain adaptation with target data available - that is a different, easier
   problem, and I want that distinction called out), domain-adversarial training,
   Jacobian or gradient regularization, methods needing no shortcut labels,
   evidence that foundation-model embeddings encode device or centre signature,
   and colour constancy / white balance / sensor variation as a confounder.

4. FUSION WHEN ONE MODALITY DOMINATES. Symptoms carry nearly all of our signal, so
   the image branch is never forced to learn disease features. Work on modality
   dominance, independent per-branch supervision, missing-modality robustness,
   gating, and ensembling frozen branches rather than picking one, is directly
   actionable.

5. TABULAR FOUNDATION MODELS AND IN-CONTEXT LEARNING. TabPFN is our strongest
   single branch. Successors, scaling, calibration behaviour and tabular+image
   joint models all matter.

6. CALIBRATION AND THRESHOLDS FOR DEPLOYMENT. A single global cutoff versus
   per-site recalibration, how few positives a new site needs, prevalence shift,
   threshold transfer without labels, and honest reporting of leave-site-out
   ranges rather than pooled cross-validation. Also reporting standards and
   regulatory paths for AI diagnostics and clinical decision support.

7. LICENSING AND WEIGHT AVAILABILITY. I need commercially usable weights. Note
   when a release is genuinely open (Apache/MIT) versus non-commercial or
   research-only, and flag new medical encoder releases and the datasets behind
   them.

Adjacent domains I treat as PROXIES for our problem, and want covered: dermatology
and dermoscopy, external-eye and fundus photography, endoscopy and capsule
imaging, otoscopy, laryngoscopy, oral and intraoral photography, wound imaging,
and anything captured by patients on their own phones.

DOWNRANK: LLM chatbots and medical question answering, radiology report
generation, clinical note summarization, drug discovery and protein structure,
pure NLP benchmarks, agent frameworks, general leaderboard chasing with no
transfer story, and consumer AI product news. Also downrank small-public-dataset
imaging papers reporting AUC above 0.95 without patient-level splits - in this
space that is leakage, not a result.

I would rather see five papers that change an experiment than forty that are
merely on-topic.
"""

[overrides]
min_score = 0.60

