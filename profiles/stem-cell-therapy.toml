# Profile: stem-cell-therapy (全球干细胞研究进展 / global stem-cell research progress)
# Scope: worldwide stem-cell research from significant basic discoveries through
# to clinical therapy — cell therapies in trials and the clinic (iPSC, ESC,
# MSC / mesenchymal stromal, HSC), organoid- and tissue-engineering
# therapeutics, regenerative repair, reprogramming and stem-cell biology, plus
# the manufacturing / regulatory / safety story behind getting cells into
# patients. Widened 2026-10-22 from clinical-only to match Chiming Wei's request
# for global stem-cell research progress; clinical work is still weighted highest.
# Bilingual digest: Traditional Chinese on top, English below.

name = "stem-cell-therapy"
description = "Global stem-cell research progress, from major basic discoveries to the clinic: cell-therapy trials (iPSC/ESC/MSC/HSC), organoids and tissue engineering, reprogramming, manufacturing, safety, and regulatory milestones worldwide."

# Grouping in the reader app. "additional" keeps this feed out of the main inbox
# and unread count; the digest is still emailed and still readable under Digests.
reader_group = "additional"

paywalled_domains = [
    "cell.com",
    "nature.com",
    "science.org",
    "thelancet.com",
    "nejm.org",
    "jamanetwork.com",
    "sciencedirect.com",
    "academic.oup.com",
    "wiley.com",
]

[feeds]
list = [
    # === Core stem-cell / regenerative journals ===
    "Cell Stem Cell | https://www.cell.com/cell-stem-cell/inpress.rss",
    "Stem Cell Reports | https://www.cell.com/stem-cell-reports/inpress.rss",
    "Stem Cell Research & Therapy | https://link.springer.com/search.rss?facet-journal-id=13287",
    "npj Regenerative Medicine | https://www.nature.com/npjregenmed.rss",
    "Cytotherapy | https://rss.sciencedirect.com/publication/science/14653249",

    # === High-impact medicine / biotech ===
    "Nature Medicine | https://www.nature.com/nm.rss",
    "Nature Biotechnology | https://www.nature.com/nbt.rss",
    "Science Translational Medicine | https://www.science.org/action/showFeed?type=etoc&feed=rss&jc=stm",
    "Cell | https://www.cell.com/cell/inpress.rss",

    # === News / community ===
    "The Niche (Knoepfler stem-cell blog) | https://ipscell.com/feed/",
    "STAT News | https://www.statnews.com/feed/",
    "ScienceDaily - Stem Cells | https://www.sciencedaily.com/rss/health_medicine/stem_cells.xml",

    # === Basic stem-cell and developmental biology (for the global research scope) ===
    "Nature Cell Biology | https://www.nature.com/ncb.rss",
    "Development | https://journals.biologists.com/rss/site_1000005/1000005.xml",

    # === Preprints ===
    "bioRxiv - cell biology | http://connect.biorxiv.org/biorxiv_xml.php?subject=cell_biology",
    "bioRxiv - developmental biology | http://connect.biorxiv.org/biorxiv_xml.php?subject=developmental_biology",

    # (PubMed search feeds removed: they return HTTP 404/500 and contributed nothing.)
]

[interests]
keywords = [
    # Cell types / sources
    "stem cell therapy",
    "regenerative medicine",
    "cell therapy",
    "induced pluripotent stem cell",
    "iPSC",
    "embryonic stem cell",
    "mesenchymal stem cell",
    "mesenchymal stromal cell",
    "hematopoietic stem cell",
    "neural stem cell",
    "organoid",
    "tissue engineering",

    # Clinical translation
    "clinical trial",
    "first-in-human",
    "cell transplantation",
    "autologous",
    "allogeneic",
    "regenerative repair",
    "stem cell transplant",
    "advanced therapy medicinal product",
    "cell manufacturing",
    "GMP cell",
    "off-the-shelf cell",

    # Therapeutic areas
    "spinal cord injury repair",
    "Parkinson cell therapy",
    "macular degeneration cell",
    "type 1 diabetes islet",
    "cartilage repair",
    "heart regeneration",
    "graft versus host",
    "bone marrow transplant",

    # Safety / regulatory
    "teratoma",
    "tumorigenicity",
    "cell therapy safety",
    "FDA cell therapy",
    "stem cell tourism",
]

narrative = """
This feed tracks GLOBAL PROGRESS IN STEM-CELL RESEARCH — from significant basic discoveries through to therapies reaching patients — across the US, Europe, Japan, China, and elsewhere. Clinical translation is weighted highest (trials, first-in-human results, manufacturing, safety, regulation), but a genuinely important basic-science advance belongs here too.

SURFACE HIGH (score >= 0.70):
- Clinical trials of stem-cell / regenerative therapies: first-in-human, phase I-III results, new INDs, regulatory approvals (FDA / EMA / PMDA). iPSC-, ESC-, MSC/stromal-, HSC-, and neural-stem-cell-based therapies.
- Landmark therapeutic-area progress: iPSC-derived dopaminergic neurons for Parkinson's, RPE cells for macular degeneration, islet / beta-cell therapy for type 1 diabetes, cell therapy for spinal cord injury, cartilage / bone / cardiac regeneration, HSC transplant advances, GvHD.
- Organoid- and tissue-engineering therapeutics with a translational path (transplantable tissues, bioprinted constructs going toward the clinic).
- Cell-manufacturing and delivery advances that unlock therapies: GMP scale-up, off-the-shelf / allogeneic "universal" cells, hypoimmunogenic engineering, potency assays, cryopreservation, in-vivo reprogramming.
- Safety & rigor: tumorigenicity / teratoma risk, long-term follow-up, and HONEST negative or null trial results.
- Mechanistic stem-cell biology that directly enables therapy (reprogramming, differentiation protocols, stemness, niche control).
- Major basic-science discoveries in stem-cell biology even without an immediate therapy: new stem-cell types or states, reprogramming breakthroughs, embryo models and organoids that change what can be studied, and landmark findings in high-impact journals.
- National and international milestones: first approvals in a country, large national programmes, and notable progress from Chinese, Japanese, and European groups.

ALSO TRACK (score 0.5-0.7):
- Preclinical / animal-model regenerative results with a clear clinical rationale.
- Policy, funding, and ethics news on stem-cell / regenerative medicine (ISSCR guidelines, reimbursement, right-to-try).
- Biotech / company milestones (financing tied to a specific clinical program, partnerships) when there's real scientific substance.
- Adjacent engineered-cell therapies (CAR-based) ONLY when the angle is stem-cell-derived or regenerative, not pure oncology immunotherapy.

SCORE DOWN (<= 0.4) OR EXCLUDE:
- Unproven "stem cell clinic" / stem-cell-tourism marketing, supplement or cosmetic "stem cell" products — UNLESS the article is a rigorous expose / regulatory crackdown.
- Pure cancer immunotherapy (CAR-T for lymphoma) with no regenerative / stem-cell dimension.
- Incremental basic developmental biology with neither a therapeutic line of sight nor a major conceptual advance.
- Hype press releases with no data, vague "breakthrough" claims.
- General gene-therapy news unless it intersects stem / regenerative cells.

DEFAULTS:
- Weight clinical-stage evidence and manufacturing/safety substance over early preclinical buzz.
- An honest failed or null trial is HIGH signal — surface it.
- When unsure if a CAR / gene therapy belongs here, ask: is the therapeutic a stem / progenitor / regenerative cell? If no, score down.
"""

[overrides]
min_score = 0.50

