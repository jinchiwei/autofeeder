# Profile: alzheimers
# Scope: the most important advances in Alzheimer's disease research, broadly.
# Deliberately NOT specialised, but NOT imaging-averse either: imaging is a
# first-class subfield here, judged on the same bar as therapeutics or biology
# (relaxed 2026-09-20 — the previous rules suppressed it too hard). Only a soft
# guard remains so no single subfield swallows the whole digest. For the imaging
# x genetics intersection specifically, the `agi` profile goes deeper.

name = "alzheimers"
description = "The most important advances in Alzheimer's disease research, across all subfields — biology, therapeutics, trials, biomarkers, epidemiology, care."

# Top-level key — MUST sit above the first [section] header (TOML scoping rule).
