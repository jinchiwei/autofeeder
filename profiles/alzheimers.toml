# Profile: alzheimers
# Scope: the most important advances in Alzheimer's disease research, broadly.
# Deliberately NOT specialised. Imaging and genetics are welcome but must not
# dominate — see the narrative. For the imaging x genetics intersection
# specifically, use the `agi` profile instead.

name = "alzheimers"
description = "The most important advances in Alzheimer's disease research, across all subfields — biology, therapeutics, trials, biomarkers, epidemiology, care."

# Top-level key — MUST sit above the first [section] header (TOML scoping rule).
paywalled_domains = [
    "jamanetwork.com",
    "thelancet.com",
    "cell.com",
    "nature.com",
    "science.org",
    "academic.oup.com",
    "pubs.rsna.org",
    "onlinelibrary.wiley.com",
    "neurology.org",
    "ajnr.org",
    "sciencedirect.com",
]

