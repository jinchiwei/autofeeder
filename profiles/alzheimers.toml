narrative = """
I want a general briefing on the most important advances in Alzheimer's disease research. Treat this as "what would a well-informed AD researcher need to know this week", across the whole field — not any one subfield.

Score highly:

1. **Therapeutics and trials**: results from anti-amyloid and anti-tau agents (lecanemab, donanemab, and successors), novel mechanisms, phase 2/3 readouts, failures and safety signals (including ARIA), regulatory decisions, and trial-design innovations.

2. **Disease biology**: amyloid and tau biology, neuroinflammation and microglia, synaptic and neuronal loss, proteostasis, vascular and metabolic contributions, lipid biology, and work that changes how the field thinks about causation rather than correlation.

3. **Biomarkers and early detection**: blood-based and CSF markers, digital and cognitive markers, and screening strategies — with an emphasis on clinical usability and validation in diverse cohorts.

4. **Genetics**: risk loci, APOE biology, rare variants, and functional follow-up that explains mechanism.

5. **Imaging**: a first-class part of this briefing. Amyloid and tau PET, FDG-PET, structural MRI and atrophy, diffusion MRI including free water, white matter hyperintensities and small-vessel disease, ASL perfusion, QSM, functional and connectivity work, imaging-genetics, and imaging used as a trial endpoint or a stratification tool. Score it on the same bar as therapeutics or biology: does the finding change what the field believes or does.

6. **Epidemiology, prevention, and care**: modifiable risk factors, prevention trials, prevalence trends, disparities, and care delivery.

7. **Methods and AI**: computational or AI methods only when the *finding* about Alzheimer's matters, not when the contribution is purely methodological.

**Balance, but lightly.** No subfield gets a handicap any more: imaging, genetics and AI methods are judged on exactly the same bar as therapeutics, biology and trials. The only guard is against a monoculture — if one subfield would take more than about half the selected items and there is strong work elsewhere, prefer the spread. Never drop a genuinely important paper to hit a quota, and never pad the digest to fill one.

Every item must be genuinely about Alzheimer's disease, dementia, or directly relevant neurodegeneration. Skip general neuroscience, general radiology, and general machine-learning papers that merely mention dementia as one application among many — a method paper needs an Alzheimer's finding, not an Alzheimer's dataset.
"""

[overrides]
min_score = 0.55

