# Profile: venus
# Scope: East-West integrative medicine and healthcare innovation — above all,
# how Eastern medicine (especially TCM) is being brought together with modern
# biomedicine and AI in serious, robust, peer-reviewed research. Rigorous trials
# and systematic reviews of traditional interventions, AI applied to TCM with
# real validation, and integration into health systems and guidelines.
# The lens is evidence-first: it surfaces work that would survive scrutiny and
# says so plainly when a study is weak, rather than amplifying wellness claims.
# Reinstated 2026-10-22 with a sharper scope than the archived version (which
# leaned toward mind-body science and science journalism).

name = "venus"
description = "East-West integrative medicine and healthcare innovation: how TCM and other traditional medicine is being integrated with AI and modern biomedicine in rigorous, peer-reviewed studies, trials, and health systems."

reader_group = "main"

paywalled_domains = [
    "nature.com",
    "science.org",
    "thelancet.com",
    "jamanetwork.com",
    "nejm.org",
    "cell.com",
    "sciencedirect.com",
    "academic.oup.com",
    "link.springer.com",
    "onlinelibrary.wiley.com",
]

[feeds]
list = [
    # === TCM and integrative medicine journals ===
    "Chinese Medicine | https://link.springer.com/search.rss?facet-journal-id=13020",
    "Chinese Journal of Integrative Medicine | https://link.springer.com/search.rss?facet-journal-id=11655",
    "BMC Complementary Medicine and Therapies | https://link.springer.com/search.rss?facet-journal-id=12906",
    "Journal of Integrative Medicine | https://rss.sciencedirect.com/publication/science/20954964",
    "Integrative Medicine Research | https://rss.sciencedirect.com/publication/science/22134220",
    "Complementary Therapies in Medicine | https://rss.sciencedirect.com/publication/science/09652299",

    # === Pharmacology of natural products (high volume; the narrative filters hard) ===
    "Phytomedicine | https://rss.sciencedirect.com/publication/science/09447113",
    "Journal of Ethnopharmacology | https://rss.sciencedirect.com/publication/science/03788741",
    "Frontiers in Pharmacology | https://www.frontiersin.org/journals/pharmacology/rss",

    # === AI x traditional medicine (arXiv; requests are spaced per arXiv's terms) ===
    "arXiv - traditional Chinese medicine | https://export.arxiv.org/api/query?search_query=abs:%22traditional+Chinese+medicine%22&sortBy=submittedDate&sortOrder=descending&max_results=40",
    "arXiv - tongue and pulse diagnosis | https://export.arxiv.org/api/query?search_query=abs:%22tongue+diagnosis%22+OR+abs:%22pulse+diagnosis%22+OR+abs:%22tongue+image%22&sortBy=submittedDate&sortOrder=descending&max_results=40",
    "arXiv - herbal medicine and AI | https://export.arxiv.org/api/query?search_query=abs:%22herbal%22+AND+%28abs:%22deep+learning%22+OR+abs:%22language+model%22%29&sortBy=submittedDate&sortOrder=descending&max_results=40",

    # === Clinical and digital-health journals where the strongest work lands ===
    "Nature Medicine | https://www.nature.com/nm.rss",
    "npj Digital Medicine | https://www.nature.com/npjdigitalmed.rss",
    "Lancet Digital Health | https://www.thelancet.com/rssfeed/landig_current.xml",

    # === Health news with policy and system-level coverage ===
    "STAT News | https://www.statnews.com/feed/",
]

[interests]
keywords = [
    "traditional Chinese medicine",
    "TCM",
    "integrative medicine",
    "integrative oncology",
    "complementary medicine",
    "acupuncture",
    "electroacupuncture",
    "Chinese herbal medicine",
    "herbal formula",
    "Kampo",
    "Ayurveda",
    "Korean medicine",
    "randomized controlled trial",
    "systematic review",
    "meta-analysis",
    "pragmatic trial",
    "sham-controlled",
    "preregistered",
    "multicenter",
    "artificial intelligence",
    "machine learning",
    "deep learning",
    "large language model",
    "tongue diagnosis",
    "pulse diagnosis",
    "syndrome differentiation",
    "herb recommendation",
    "network pharmacology",
    "natural product drug discovery",
    "mechanism of action",
    "quality control",
    "standardization",
    "herb-drug interaction",
    "safety",
    "clinical practice guideline",
    "ICD-11 traditional medicine",
    "WHO traditional medicine",
    "health system integration",
]

narrative = """
I want to follow how Eastern medicine, especially traditional Chinese medicine, is being integrated with modern biomedicine and with AI in work that is serious, robust, and peer-reviewed. The question behind every item: does this move traditional medicine toward evidence a skeptical Western clinician would accept, or show where it fails?

SURFACE HIGH (score >= 0.70):
- Rigorous clinical evidence on traditional interventions: well-powered randomized trials (sham-controlled where possible), preregistered and multicenter studies, pragmatic trials, and high-quality systematic reviews and meta-analyses, especially in major journals. Acupuncture, Chinese herbal formulas, integrative oncology and supportive care, pain, and chronic disease.
- AI applied to TCM with real validation: tongue, pulse, or face diagnosis models tested on external data; machine learning for syndrome differentiation or treatment selection; herb and formula recommendation; large language models for TCM knowledge that are properly evaluated; AI-driven drug discovery from natural products with experimental follow-up.
- Integration into health systems and practice: integrative programmes in hospitals, clinical guidelines that adopt (or reject) traditional interventions on evidence, WHO and ICD-11 traditional-medicine work, and national policy on modernising and regulating TCM.
- Mechanism and safety science that holds up: well-controlled mechanistic studies of acupuncture or herbal actives, herb-drug interactions, toxicity, quality control, and standardisation of herbal products.
- Clear, well-designed negative or null results: a rigorous trial showing no benefit is high signal.

ALSO TRACK (score 0.5-0.7):
- Promising but early studies with sound design, and natural-product pharmacology with genuine experimental validation.
- East-West collaborations, cross-cultural healthcare innovation, and digital-health tools built around traditional practice.
- Thoughtful commentary or reviews on the evidence base and methodology of integrative medicine research.

SCORE DOWN (<= 0.4) OR EXCLUDE:
- Network-pharmacology and molecular-docking papers with no experimental or clinical validation. These are extremely common and rarely informative.
- Small, unregistered, single-centre trials with only surrogate outcomes and no proper control.
- Wellness marketing, supplement promotion, and "cure" claims.
- Tongue or pulse diagnosis models evaluated only on the data they were trained on, or reporting implausibly high accuracy on small private datasets.
- Articles that mention traditional medicine in passing without studying it.
- Letters to the editor, comments, replies, and corrigenda, unless they expose a serious flaw in a major study.

DEFAULTS:
- Weight study design over topic: a strong trial on a modest question beats a weak study on an exciting one.
- In each summary, state the design plainly (trial type, size, control, whether it was preregistered) so I can judge rigour at a glance.
- Never treat a traditional claim as validated unless the study design supports it.
"""

[overrides]
# 0.65, not 0.58: the first run kept 40 items at 0.58 and its bottom eighth was
# letters and replies. This feed is meant to be the rigorous end of the field.
min_score = 0.65

